name: Tests
# Simulated-client tests (Lua 5.1). They check addon logic, not the live Forever client.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: bash tools/run-tests.sh
      - name: Package builds with the standard name
        run: |
          ver=$(grep -m1 '^## Version:' ReadyMacros.toc | sed 's/^## Version: *//' | tr -d '\r')
          path=$(bash tools/package.sh | tail -1)
          test -f "$path"
          test "$(basename "$path")" = "ReadyMacros-v${ver}-forever.zip"
